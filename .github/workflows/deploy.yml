name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Zip build artifact
        run: zip -j app.zip target/*.jar

      - name: Deploy to Azure Web App via Kudu
        run: |
          curl -X POST -u "${{ secrets.KUDU_USERNAME }}:${{ secrets.KUDU_PASSWORD }}" \
            -F "package=@app.zip" \
            "https://${{ secrets.KUDU_URL }}/api/zipdeploy"
